app:
    name: toirtis
    debug: true

logging:
    level: INFO
    file:
        path: logs/toirtis.log
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    console:
        format: "%(log_color)s%(asctime)s - %(name)s - %(levelname)s - %(message)s"
        colors:
            DEBUG: cyan
            INFO: green
            WARNING: yellow
            ERROR: red
            CRITICAL: red,bg_white

db:
    filename: toirtis.db
    connection_string: sqlite+aiosqlite:///toirtis.db
    overwrite: false

tasks:
    - name: metrics_collection
      class: MetricsTask
      frequency: 5
      enabled: true

    - name: camera_capture
      class: CameraTask
      frequency: 5
      enabled: true
      parameters:
          cameras:
              - port: 0
                name: cam0
                output_folder: images/cam0
          image_format: jpg
          quality: 95
          resolution:
              width: 1920
              height: 1080
          rotation: 0
          capture_timeout: 3
          retry_attempts: 1

