app:
    name: toirtis-dev
    debug: true

logging:
    level: DEBUG
    file:
        path: logs/toirtis_dev.log
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    console:
        format: "%(log_color)s%(asctime)s - %(name)s - %(levelname)s - %(message)s"
        colors:
            DEBUG: cyan
            INFO: green
            WARNING: yellow
            ERROR: red
            CRITICAL: red,bg_white

db:
    filename: toirtis_dev.db
    connection_string: sqlite+aiosqlite:///toirtis_dev.db
    overwrite: false

tasks:
    - name: barometer_reading
      class: BaroTask
      frequency: 2
      enabled: true
      parameters:
          i2c_bus: 1
          address: 0x77
          sea_level_pressure: 1013.25

    - name: imu_reading
      class: ImuTask
      frequency: 2
      enabled: true
      parameters:
          i2c_bus: 1
          address: 0x6A
          accel_range: "16G"
          gyro_range: "500DPS"

    - name : robot_task
      class: RobotTask
      frequency: 5
      enabled: true
      parameters:
          front_servo_port: /dev/ttyACM1
          back_servo_port: /dev/ttyACM0
          front_servo_ids: [2, 6, 3, 5]
          back_servo_ids: [4, 6, 1, 2]

    - name: flight_task
      class: FlightTask
      frequency: 5
      enabled: true
      parameters:
          main_height: 100.0
          liftoff_threshold: 20.0
          drouge_delay: 0
          accel_axis: accel_x
          gravity_offset: 9.81
